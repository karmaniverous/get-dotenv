name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use npm 11.19.1
        run: npm install --global npm@11.19.1

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (with coverage)
        run: npm test -- --coverage

      # The 7.0.11 behaviour baseline test writes the current output here on
      # every run; upload it when tests fail so a differing case can be read.
      - name: Upload baseline actual output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-actual-${{ matrix.os }}
          path: .tsbuild/baseline-actual
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Knip
        run: npm run knip

      - name: Docs
        run: npm run docs

      - name: verify:types
        run: npm run verify:types

      - name: verify:package
        run: npm run verify:package

      - name: verify:smoke
        run: npm run verify:smoke

      - name: verify:bundle
        run: npm run verify:bundle

      - name: verify:tarball
        run: npm run verify:tarball
